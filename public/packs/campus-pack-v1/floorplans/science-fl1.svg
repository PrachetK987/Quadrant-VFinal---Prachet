<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" class="floorplan-svg">
  <defs>
    <style>
      .room { fill: #1e293b; stroke: #475569; stroke-width: 2; transition: all 0.2s ease; cursor: pointer; }
      .room:hover { fill: #334155; stroke: #38bdf8; }
      .room.active { fill: #0369a1 !important; stroke: #38bdf8 !important; stroke-width: 3; }
      .corridor { fill: #0f172a; stroke: #334155; stroke-dasharray: 4; }
      .room-label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; pointer-events: none; text-anchor: middle; }
      .room-sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #94a3b8; pointer-events: none; text-anchor: middle; }
      .wall { stroke: #64748b; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <rect x="40" y="40" width="720" height="520" rx="8" class="wall" />
  <rect x="360" y="40" width="80" height="520" class="corridor" />

  <!-- Room S101: Robotics & Makerspace -->
  <g id="room-s101" class="room-group">
    <rect x="60" y="60" width="280" height="230" rx="4" class="room" />
    <text x="200" y="165" class="room-label">Room S101 - Robotics Lab</text>
    <text x="200" y="185" class="room-sub">3D Printers, Soldering stations, Outlets</text>
  </g>

  <!-- Room S105: Physics Lecture Hall -->
  <g id="room-s105" class="room-group">
    <rect x="60" y="310" width="280" height="230" rx="4" class="room" />
    <text x="200" y="415" class="room-label">Room S105 - Physics Hall A</text>
    <text x="200" y="435" class="room-sub">Tiered seating, High-speed Wi-Fi</text>
  </g>

  <!-- Room S110: Computer Science Lab -->
  <g id="room-s110" class="room-group">
    <rect x="460" y="60" width="280" height="230" rx="4" class="room" />
    <text x="600" y="165" class="room-label">Room S110 - Linux Lab</text>
    <text x="600" y="185" class="room-sub">Dual monitors, Gigabit ethernet, Quiet</text>
  </g>

  <!-- Room S115: Faculty Offices & Advising -->
  <g id="room-s115" class="room-group">
    <rect x="460" y="310" width="280" height="230" rx="4" class="room" />
    <text x="600" y="415" class="room-label">Room S115 - Advising Center</text>
    <text x="600" y="435" class="room-sub">Walk-in tutoring, peer advising</text>
  </g>
</svg>
