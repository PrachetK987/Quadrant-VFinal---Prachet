<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" class="floorplan-svg">
  <defs>
    <style>
      .room { fill: #1e293b; stroke: #475569; stroke-width: 2; transition: all 0.2s ease; cursor: pointer; }
      .room:hover { fill: #334155; stroke: #38bdf8; }
      .room.active { fill: #0369a1 !important; stroke: #38bdf8 !important; stroke-width: 3; }
      .corridor { fill: #0f172a; stroke: #334155; stroke-dasharray: 4; }
      .room-label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; pointer-events: none; text-anchor: middle; }
      .room-sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #94a3b8; pointer-events: none; text-anchor: middle; }
      .wall { stroke: #64748b; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <rect x="40" y="40" width="720" height="520" rx="8" class="wall" />
  <rect x="40" y="270" width="720" height="60" class="corridor" />

  <!-- Room U101: Food Court & Microwaves -->
  <g id="room-u101" class="room-group">
    <rect x="60" y="60" width="320" height="190" rx="4" class="room" />
    <text x="220" y="150" class="room-label">Food Court & Dining</text>
    <text x="220" y="170" class="room-sub">Microwaves, Hot water, Seating for 200</text>
  </g>

  <!-- Room U102: Student Lounge & Gaming -->
  <g id="room-u102" class="room-group">
    <rect x="420" y="60" width="320" height="190" rx="4" class="room" />
    <text x="580" y="150" class="room-label">Student Lounge & Hub</text>
    <text x="580" y="170" class="room-sub">Couches, Charging Hubs, Pool tables</text>
  </g>

  <!-- Room U103: Commuter Locker Bay -->
  <g id="room-u103" class="room-group">
    <rect x="60" y="350" width="320" height="190" rx="4" class="room" />
    <text x="220" y="440" class="room-label">Commuter Services & Lockers</text>
    <text x="220" y="460" class="room-sub">Day use lockers, Quiet retreat</text>
  </g>

  <!-- Room U104: Campus Store & ATM -->
  <g id="room-u104" class="room-group">
    <rect x="420" y="350" width="320" height="190" rx="4" class="room" />
    <text x="580" y="440" class="room-label">Campus Store & Banking</text>
    <text x="580" y="460" class="room-sub">Supplies, Merch, Wells Fargo / Chase ATM</text>
  </g>
</svg>
